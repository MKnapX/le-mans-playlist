<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Mans Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8ff00;
    --accent2: #ff4d00;
    --text: #f0f0f0;
    --muted: #666;
    --yes: #00e676;
    --no: #ff1744;
    --pending: #ffab00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  #login-screen::before {
    content: '';
    position: absolute;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(232,255,0,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  #login-screen::after {
    content: 'LE MANS 2025';
    position: absolute;
    bottom: 2rem; right: 2rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    opacity: 0.4;
  }

  .login-flag {
    display: flex;
    gap: 6px;
    margin-bottom: 2rem;
  }
  .login-flag span {
    display: block;
    width: 18px;
    height: 60px;
  }
  .flag-black { background: #111; border: 1px solid #333; }
  .flag-white { background: #eee; }

  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 0.05em;
    line-height: 0.9;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .login-title span {
    color: var(--accent);
    display: block;
  }

  .login-sub {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    text-align: center;
  }

  .user-select {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 320px;
    margin-bottom: 1.5rem;
  }

  .user-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 1rem 1.5rem;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .user-btn:hover {
    border-color: var(--accent);
    background: rgba(232,255,0,0.05);
  }

  .user-btn .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .user-btn.alex .avatar { background: #00b4d8; }
  .user-btn.james .avatar { background: var(--accent2); color: #fff; }

  .pin-screen {
    width: 100%;
    max-width: 320px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .pin-screen.active { display: flex; }

  .pin-label {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pin-dots {
    display: flex;
    gap: 1rem;
  }

  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.15s;
  }

  .pin-dot.filled {
    background: var(--accent);
    border-color: var(--accent);
  }

  .pin-dot.error {
    background: var(--no);
    border-color: var(--no);
  }

  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    width: 100%;
  }

  .pin-key {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 1.1rem;
    border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.1s;
    text-align: center;
  }

  .pin-key:hover { background: var(--surface2); border-color: var(--accent); }
  .pin-key:active { transform: scale(0.95); }
  .pin-key.clear { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; }

  .back-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 0.5rem;
  }

  .login-error {
    color: var(--no);
    font-size: 0.85rem;
    min-height: 1.2em;
    text-align: center;
  }

  /* ── MAIN APP ── */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.active { display: flex; }

  .top-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .top-bar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .top-bar-user {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .top-bar-user .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--yes);
  }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    cursor: pointer;
  }

  .nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 53px;
    z-index: 99;
  }

  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.9rem 0.5rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    position: relative;
  }

  .nav-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .nav-badge {
    position: absolute;
    top: 6px; right: calc(50% - 20px);
    background: var(--accent2);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .view { display: none; padding: 1.25rem 1rem; flex: 1; }
  .view.active { display: block; }

  /* ── ADD VIEW ── */
  .search-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.75rem 1rem;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .search-btn {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 0.75rem 1.25rem;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .search-btn:hover { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .search-results { display: flex; flex-direction: column; gap: 0.5rem; }

  .track-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: border-color 0.15s;
  }

  .track-card:hover { border-color: #444; }

  .track-art {
    width: 48px; height: 48px;
    border-radius: 3px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .track-info { flex: 1; min-width: 0; }

  .track-name {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .track-duration {
    color: var(--muted);
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .nominate-btn {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 0.45rem 0.9rem;
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .nominate-btn:hover { opacity: 0.85; }

  .nominate-btn.already {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    cursor: default;
  }

  .nominate-btn.rejected {
    background: rgba(255,23,68,0.1);
    color: var(--no);
    border: 1px solid var(--no);
    cursor: default;
    font-size: 0.72rem;
  }

  .search-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 2rem 1rem;
  }

  .spotify-note {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(29,185,84,0.1);
    border: 1px solid rgba(29,185,84,0.2);
    border-radius: 4px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.82rem;
    color: #1db954;
  }

  .not-connected {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2rem;
    text-align: center;
  }

  .not-connected p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }

  .spotify-connect-btn {
    background: #1db954;
    border: none;
    color: #fff;
    padding: 0.8rem 1.5rem;
    border-radius: 24px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: opacity 0.15s;
  }

  .spotify-connect-btn:hover { opacity: 0.85; }

  /* ── QUEUE VIEW ── */
  .queue-empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 3rem 1rem;
  }

  .queue-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.9rem;
    margin-bottom: 0.75rem;
  }

  .queue-card-top {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }

  .queue-track-info { flex: 1; min-width: 0; }

  .queue-nominator {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .nominator-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .queue-votes {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .vote-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
  }

  .vote-pip.yes { background: var(--yes); border-color: var(--yes); }
  .vote-pip.no { background: var(--no); border-color: var(--no); }

  .vote-label {
    font-size: 0.72rem;
    color: var(--muted);
    margin-left: 2px;
  }

  .queue-actions {
    display: flex;
    gap: 0.5rem;
  }

  .vote-btn {
    flex: 1;
    padding: 0.55rem;
    border-radius: 3px;
    border: 1px solid;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .vote-btn.yes-btn {
    background: rgba(0,230,118,0.08);
    border-color: rgba(0,230,118,0.3);
    color: var(--yes);
  }

  .vote-btn.yes-btn:hover:not(:disabled) {
    background: rgba(0,230,118,0.18);
    border-color: var(--yes);
  }

  .vote-btn.no-btn {
    background: rgba(255,23,68,0.08);
    border-color: rgba(255,23,68,0.3);
    color: var(--no);
  }

  .vote-btn.no-btn:hover:not(:disabled) {
    background: rgba(255,23,68,0.18);
    border-color: var(--no);
  }

  .vote-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .vote-btn.voted-yes {
    background: rgba(0,230,118,0.2);
    border-color: var(--yes);
    color: var(--yes);
  }

  .vote-btn.voted-no {
    background: rgba(255,23,68,0.2);
    border-color: var(--no);
    color: var(--no);
  }

  .own-vote-label {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 0.4rem;
  }

  /* ── PLAYLIST VIEW ── */
  .playlist-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .playlist-stats { font-size: 0.82rem; color: var(--muted); }
  .playlist-stats strong { color: var(--text); font-size: 1rem; display: block; margin-bottom: 2px; }

  .open-spotify-btn {
    background: #1db954;
    border: none;
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .playlist-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .playlist-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--muted);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .playlist-track-info { flex: 1; min-width: 0; }

  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 3px;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .remove-btn:hover { color: var(--no); }

  .playlist-empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 3rem 1rem;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.75rem 1.25rem;
    border-radius: 4px;
    font-size: 0.85rem;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
    max-width: 90vw;
    white-space: normal;
    text-align: center;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--yes); color: var(--yes); }
  .toast.error { border-color: var(--no); color: var(--no); }

  /* ── LOADING ── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
    margin-top: 1.25rem;
  }

  .section-label:first-child { margin-top: 0; }

  /* user color coding */
  .color-matt { color: var(--accent); }
  .color-alex { color: #00b4d8; }
  .color-james { color: var(--accent2); }

  .dot-matt { background: var(--accent); }
  .dot-alex { background: #00b4d8; }
  .dot-james { background: var(--accent2); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-flag">
    <span class="flag-black"></span>
    <span class="flag-white"></span>
    <span class="flag-black"></span>
    <span class="flag-white"></span>
  </div>
  <div class="login-title">Road Trip<span>Playlist</span></div>
  <div class="login-sub">Le Mans · June 2025</div>

  <div class="user-select" id="user-select">
    <button class="user-btn matt" onclick="selectUser('Matt')">
      <div class="avatar">M</div>
      Matt
    </button>
    <button class="user-btn alex" onclick="selectUser('Alex')">
      <div class="avatar">A</div>
      Alex
    </button>
    <button class="user-btn james" onclick="selectUser('James')">
      <div class="avatar">J</div>
      James
    </button>
  </div>

  <div class="pin-screen" id="pin-screen">
    <div class="pin-label" id="pin-label">Enter PIN for <span id="pin-username"></span></div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key clear" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key clear" onclick="pinBack()">←</button>
    </div>
    <div class="login-error" id="pin-error"></div>
    <button class="back-btn" onclick="backToUsers()">← Back</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="top-bar">
    <div class="top-bar-title">🏁 Le Mans Mix</div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div class="top-bar-user">
        <div class="dot" id="user-dot"></div>
        <span id="user-label"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-add" onclick="showView('add')">＋ Add</button>
    <button class="nav-btn" id="nav-queue" onclick="showView('queue')">Voting <span class="nav-badge" id="queue-badge" style="display:none"></span></button>
    <button class="nav-btn" id="nav-playlist" onclick="showView('playlist')">Playlist</button>
  </div>

  <!-- ADD VIEW -->
  <div class="view active" id="view-add">
    <div id="spotify-connect-area">
      <div class="not-connected">
        <p>Connect your Spotify account to search for songs</p>
        <button class="spotify-connect-btn" onclick="spotifyLogin()">

<script>
// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const CLIENT_ID = 'cb4d4466b58741f49ef70b61a4db61dd';
const REDIRECT_URI = 'https://mknapx.github.io/le-mans-playlist';
const SCOPES = 'playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public';

const USERS = {
  Matt:  { pin: '8787', color: 'matt', admin: true },
  Alex:  { pin: '2222', color: 'alex',  admin: false },
  James: { pin: '3333', color: 'james', admin: false },
};

// Shared storage keys
const STORE_QUEUE     = 'lemans-queue';
const STORE_PLAYLIST  = 'lemans-playlist';
const STORE_REJECTED  = 'lemans-rejected';
const STORE_PLAYLIST_ID = 'lemans-spotify-playlist-id';

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let currentUser = null;
let spotifyToken = null;
let spotifyUserId = null;
let pinBuffer = '';
let pendingUser = '';
let queue = [];       // { id, name, artist, art, duration_ms, nominatedBy, votes: {Matt:1,Alex:-1,...} }
let playlist = [];    // same shape but approved
let rejected = new Set();
let spotifyPlaylistId = null;

// ══════════════════════════════════════════════
//  STORAGE HELPERS (using window.storage)
// ══════════════════════════════════════════════
async function loadShared() {
  try {
    const q = await window.storage.get(STORE_QUEUE, true);
    queue = q ? JSON.parse(q.value) : [];
  } catch { queue = []; }
  try {
    const p = await window.storage.get(STORE_PLAYLIST, true);
    playlist = p ? JSON.parse(p.value) : [];
  } catch { playlist = []; }
  try {
    const r = await window.storage.get(STORE_REJECTED, true);
    rejected = r ? new Set(JSON.parse(r.value)) : new Set();
  } catch { rejected = new Set(); }
  try {
    const pid = await window.storage.get(STORE_PLAYLIST_ID, true);
    spotifyPlaylistId = pid ? pid.value : null;
  } catch { spotifyPlaylistId = null; }
}

async function saveQueue() {
  await window.storage.set(STORE_QUEUE, JSON.stringify(queue), true);
}
async function savePlaylist() {
  await window.storage.set(STORE_PLAYLIST, JSON.stringify(playlist), true);
}
async function saveRejected() {
  await window.storage.set(STORE_REJECTED, JSON.stringify([...rejected]), true);
}
async function savePlaylistId(id) {
  spotifyPlaylistId = id;
  await window.storage.set(STORE_PLAYLIST_ID, id, true);
}

// ══════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════
function selectUser(name) {
  pendingUser = name;
  pinBuffer = '';
  document.getElementById('user-select').style.display = 'none';
  document.getElementById('pin-screen').classList.add('active');
  document.getElementById('pin-username').textContent = name;
  updateDots();
  document.getElementById('pin-error').textContent = '';
}

function backToUsers() {
  document.getElementById('user-select').style.display = 'flex';
  document.getElementById('pin-screen').classList.remove('active');
  pinBuffer = '';
}

function pinPress(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updateDots();
  if (pinBuffer.length === 4) checkPin();
}

function pinClear() { pinBuffer = ''; updateDots(); }
function pinBack() { pinBuffer = pinBuffer.slice(0, -1); updateDots(); }

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);
    dot.classList.toggle('filled', i < pinBuffer.length);
    dot.classList.remove('error');
  }
}

function checkPin() {
  const user = USERS[pendingUser];
  if (pinBuffer === user.pin) {
    loginSuccess(pendingUser);
  } else {
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    setTimeout(() => { pinBuffer = ''; updateDots(); document.getElementById('pin-error').textContent = ''; }, 900);
  }
}

async function loginSuccess(name) {
  currentUser = name;
  sessionStorage.setItem('lemans-user', name);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('user-label').textContent = name;
  document.getElementById('user-dot').className = 'dot dot-' + USERS[name].color;
  await loadShared();
  checkSpotifyCallback();
  restoreSpotifyToken();
  renderAll();
}

function logout() {
  currentUser = null;
  spotifyToken = null;
  sessionStorage.removeItem('lemans-user');
  sessionStorage.removeItem('lemans-token');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('user-select').style.display = 'flex';
  document.getElementById('pin-screen').classList.remove('active');
  showView('add');
}

// ══════════════════════════════════════════════
//  SPOTIFY PKCE AUTH
// ══════════════════════════════════════════════
function generateCodeVerifier(len = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  let v = '';
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  arr.forEach(b => v += chars[b % chars.length]);
  return v;
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function spotifyLogin() {
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('lemans-user', currentUser); // persist across redirect
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id', CLIENT_ID);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge', challenge);
  window.location.href = url.toString();
}

async function checkSpotifyCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) return;
  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        client_id: CLIENT_ID,
        code_verifier: verifier,
      })
    });
    const data = await res.json();
    if (data.access_token) {
      spotifyToken = data.access_token;
      sessionStorage.setItem('lemans-token', spotifyToken);
      sessionStorage.removeItem('pkce_verifier');
      await fetchSpotifyUser();
      renderAddView();
      showToast('Spotify connected!', 'success');
    }
  } catch(e) { showToast('Spotify auth failed', 'error'); }
}

function restoreSpotifyToken() {
  const t = sessionStorage.getItem('lemans-token');
  if (t) { spotifyToken = t; fetchSpotifyUser(); }
}

async function fetchSpotifyUser() {
  const res = await spotifyFetch('https://api.spotify.com/v1/me');
  if (res) spotifyUserId = res.id;
}

async function spotifyFetch(url, opts = {}) {
  if (!spotifyToken) return null;
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), 'Authorization': 'Bearer ' + spotifyToken } });
  if (res.status === 401) { spotifyToken = null; sessionStorage.removeItem('lemans-token'); renderAddView(); return null; }
  if (!res.ok) return null;
  return res.json().catch(() => null);
}

// ══════════════════════════════════════════════
//  SPOTIFY PLAYLIST MANAGEMENT
// ══════════════════════════════════════════════
async function ensurePlaylist() {
  if (spotifyPlaylistId) return spotifyPlaylistId;
  // Only Matt (admin) creates the playlist
  if (!USERS[currentUser].admin) return null;
  const res = await spotifyFetch(`https://api.spotify.com/v1/users/${spotifyUserId}/playlists`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: '🏁 Le Mans Road Trip 2025', description: 'Our voted road trip playlist', public: false, collaborative: true })
  });
  if (res && res.id) { await savePlaylistId(res.id); return res.id; }
  return null;
}

async function addToSpotifyPlaylist(trackId) {
  if (!spotifyToken) return;
  const pid = await ensurePlaylist();
  if (!pid) return;
  await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uris: [`spotify:track:${trackId}`] })
  });
}

async function removeFromSpotifyPlaylist(trackId) {
  if (!spotifyToken || !spotifyPlaylistId) return;
  await spotifyFetch(`https://api.spotify.com/v1/playlists/${spotifyPlaylistId}/tracks`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracks: [{ uri: `spotify:track:${trackId}` }] })
  });
}

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════
function showView(name) {
  ['add','queue','playlist'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('active', v === name);
    document.getElementById('nav-' + v).classList.toggle('active', v === name);
  });
  if (name === 'queue') renderQueueView();
  if (name === 'playlist') renderPlaylistView();
  if (name === 'add') renderAddView();
}

// ══════════════════════════════════════════════
//  SEARCH
// ══════════════════════════════════════════════
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q || !spotifyToken) return;
  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Searching';
  document.getElementById('search-results').innerHTML = '<div class="search-state"><span class="spinner"></span> Searching Spotify…</div>';
  const res = await spotifyFetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=8`);
  btn.disabled = false;
  btn.textContent = 'Search';
  if (!res || !res.tracks || !res.tracks.items.length) {
    document.getElementById('search-results').innerHTML = '<div class="search-state">No results found</div>';
    return;
  }
  renderSearchResults(res.tracks.items);
}

function renderSearchResults(tracks) {
  const el = document.getElementById('search-results');
  el.innerHTML = '';
  tracks.forEach(t => {
    const art = t.album.images[2]?.url || t.album.images[0]?.url || '';
    const inQueue = queue.find(s => s.id === t.id);
    const inPlaylist = playlist.find(s => s.id === t.id);
    const isRejected = rejected.has(t.id);
    const mins = Math.floor(t.duration_ms / 60000);
    const secs = Math.floor((t.duration_ms % 60000) / 1000).toString().padStart(2,'0');

    let btnHtml = '';
    if (isRejected) {
      btnHtml = `<button class="nominate-btn rejected" disabled>Rejected</button>`;
    } else if (inPlaylist) {
      btnHtml = `<button class="nominate-btn already" disabled>In Playlist</button>`;
    } else if (inQueue) {
      btnHtml = `<button class="nominate-btn already" disabled>In Queue</button>`;
    } else {
      btnHtml = `<button class="nominate-btn" onclick="nominate('${t.id}','${esc(t.name)}','${esc(t.artists[0].name)}','${esc(art)}',${t.duration_ms})">Nominate</button>`;
    }

    el.innerHTML += `
      <div class="track-card">
        <img class="track-art" src="${art}" alt="" onerror="this.style.opacity=0">
        <div class="track-info">
          <div class="track-name">${t.name}</div>
          <div class="track-artist">${t.artists.map(a=>a.name).join(', ')}</div>
        </div>
        <div class="track-duration">${mins}:${secs}</div>
        ${btnHtml}
      </div>`;
  });
}

function esc(s) { return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ══════════════════════════════════════════════
//  NOMINATIONS & VOTING
// ══════════════════════════════════════════════
async function nominate(id, name, artist, art, duration_ms) {
  if (queue.find(s=>s.id===id) || playlist.find(s=>s.id===id) || rejected.has(id)) return;
  const song = { id, name, artist, art, duration_ms, nominatedBy: currentUser, votes: { [currentUser]: 1 } };
  queue.push(song);
  await saveQueue();
  showToast(`"${name}" added to voting queue!`, 'success');
  renderAddView(); // refresh duplicate flags
  updateQueueBadge();
}

async function vote(songId, val) {
  const song = queue.find(s => s.id === songId);
  if (!song) return;
  if (song.votes[currentUser] !== undefined) return; // already voted
  song.votes[currentUser] = val;

  const yesVotes = Object.values(song.votes).filter(v => v === 1).length;
  const noVotes  = Object.values(song.votes).filter(v => v === -1).length;

  if (yesVotes >= 2) {
    // Approve
    queue = queue.filter(s => s.id !== songId);
    playlist.push(song);
    await saveQueue();
    await savePlaylist();
    if (spotifyToken) addToSpotifyPlaylist(song.id);
    showToast(`"${song.name}" approved! 🎉`, 'success');
  } else if (noVotes >= 2) {
    // Reject
    queue = queue.filter(s => s.id !== songId);
    rejected.add(songId);
    await saveQueue();
    await saveRejected();
    showToast(`"${song.name}" rejected`, 'error');
  } else {
    await saveQueue();
  }
  renderQueueView();
  updateQueueBadge();
}

async function removeFromPlaylist(songId) {
  if (!USERS[currentUser]?.admin) return;
  const song = playlist.find(s => s.id === songId);
  if (!song) return;
  if (!confirm(`Remove "${song.name}" from the playlist?`)) return;
  playlist = playlist.filter(s => s.id !== songId);
  await savePlaylist();
  if (spotifyToken) removeFromSpotifyPlaylist(songId);
  renderPlaylistView();
  showToast(`"${song.name}" removed`, 'error');
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderAll() { renderAddView(); renderQueueView(); renderPlaylistView(); updateQueueBadge(); }

function renderAddView() {
  const connected = !!spotifyToken;
  document.getElementById('spotify-connect-area').style.display = connected ? 'none' : 'block';
  document.getElementById('spotify-search-area').style.display = connected ? 'block' : 'none';
}

function renderQueueView() {
  const el = document.getElementById('queue-list');
  if (!queue.length) { el.innerHTML = '<div class="queue-empty">No songs in the voting queue yet</div>'; return; }
  el.innerHTML = '';
  queue.forEach(song => {
    const yesVotes = Object.values(song.votes).filter(v => v === 1).length;
    const noVotes  = Object.values(song.votes).filter(v => v === -1).length;
    const myVote   = song.votes[currentUser];
    const isOwn    = song.nominatedBy === currentUser;
    const mins = Math.floor(song.duration_ms / 60000);
    const secs = Math.floor((song.duration_ms % 60000) / 1000).toString().padStart(2,'0');

    // Vote pips: one per voter
    const allUsers = Object.keys(USERS);
    const pips = allUsers.map(u => {
      const v = song.votes[u];
      if (v === 1) return `<div class="vote-pip yes" title="${u}: Yes"></div>`;
      if (v === -1) return `<div class="vote-pip no" title="${u}: No"></div>`;
      return `<div class="vote-pip" title="${u}: Not voted"></div>`;
    }).join('');

    let actionsHtml = '';
    if (isOwn) {
      actionsHtml = `<div class="own-vote-label">You nominated this — your vote is counted ✓</div>`;
    } else if (myVote !== undefined) {
      const yBtn = `<button class="vote-btn yes-btn ${myVote===1?'voted-yes':''}" disabled>✓ Yes</button>`;
      const nBtn = `<button class="vote-btn no-btn ${myVote===-1?'voted-no':''}" disabled>✗ No</button>`;
      actionsHtml = `<div class="queue-actions">${yBtn}${nBtn}</div>`;
    } else {
      actionsHtml = `<div class="queue-actions">
        <button class="vote-btn yes-btn" onclick="vote('${song.id}',1)">✓ Yes</button>
        <button class="vote-btn no-btn" onclick="vote('${song.id}',-1)">✗ No</button>
      </div>`;
    }

    el.innerHTML += `
      <div class="queue-card">
        <div class="queue-card-top">
          <img class="track-art" src="${song.art}" alt="" onerror="this.style.opacity=0">
          <div class="queue-track-info">
            <div class="track-name">${song.name}</div>
            <div class="track-artist">${song.artist} · ${mins}:${secs}</div>
            <div class="queue-nominator">
              <span class="nominator-dot dot-${USERS[song.nominatedBy]?.color}"></span>
              Nominated by ${song.nominatedBy}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div class="queue-votes">${pips}</div>
            <span class="vote-label">${yesVotes} yes · ${noVotes} no</span>
          </div>
        </div>
        ${actionsHtml}
      </div>`;
  });
}

function renderPlaylistView() {
  const el = document.getElementById('playlist-list');
  const countEl = document.getElementById('playlist-count');
  const durEl = document.getElementById('playlist-duration');
  const linkEl = document.getElementById('open-spotify-link');

  const totalMs = playlist.reduce((a, s) => a + s.duration_ms, 0);
  const totalMins = Math.floor(totalMs / 60000);
  const totalH = Math.floor(totalMins / 60);
  const totalM = totalMins % 60;
  countEl.textContent = `${playlist.length} song${playlist.length !== 1 ? 's' : ''}`;
  durEl.textContent = totalMins ? (totalH ? `${totalH}h ${totalM}m` : `${totalM} min`) : '';

  if (spotifyPlaylistId) {
    linkEl.style.display = 'inline-flex';
    linkEl.href = `https://open.spotify.com/playlist/${spotifyPlaylistId}`;
  } else {
    linkEl.style.display = 'none';
  }

  if (!playlist.length) { el.innerHTML = '<div class="playlist-empty">No approved songs yet — start voting!</div>'; return; }

  const isAdmin = USERS[currentUser]?.admin;
  el.innerHTML = '';
  playlist.forEach((song, i) => {
    const mins = Math.floor(song.duration_ms / 60000);
    const secs = Math.floor((song.duration_ms % 60000) / 1000).toString().padStart(2,'0');
    el.innerHTML += `
      <div class="playlist-item">
        <div class="playlist-num">${i + 1}</div>
        <img class="track-art" src="${song.art}" alt="" onerror="this.style.opacity=0">
        <div class="playlist-track-info">
          <div class="track-name">${song.name}</div>
          <div class="track-artist">${song.artist} · ${mins}:${secs}</div>
        </div>
        ${isAdmin ? `<button class="remove-btn" onclick="removeFromPlaylist('${song.id}')" title="Remove">🗑</button>` : ''}
      </div>`;
  });
}

function updateQueueBadge() {
  const badge = document.getElementById('queue-badge');
  const voteable = queue.filter(s => s.nominatedBy !== currentUser && s.votes[currentUser] === undefined).length;
  if (voteable > 0) {
    badge.textContent = voteable;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════
//  INIT — check if already logged in this session
// ══════════════════════════════════════════════
(async () => {
  const saved = sessionStorage.getItem('lemans-user');
  if (saved && USERS[saved]) {
    await loginSuccess(saved);
  }
  // Handle Spotify redirect even before login (token in URL, user in sessionStorage)
  const params = new URLSearchParams(window.location.search);
  if (params.get('code') && !currentUser) {
    const u = sessionStorage.getItem('lemans-user');
    if (u && USERS[u]) await loginSuccess(u);
  }
})();
</script>
