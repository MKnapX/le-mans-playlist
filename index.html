<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Mans Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8ff00;
    --accent2: #ff4d00;
    --text: #f0f0f0;
    --muted: #666;
    --yes: #00e676;
    --no: #ff1744;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem; position: relative; overflow: hidden;
  }
  #login-screen::before {
    content: '';
    position: absolute; top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(232,255,0,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  #login-screen::after {
    content: 'LE MANS 2025';
    position: absolute; bottom: 2rem; right: 2rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem; letter-spacing: 0.3em; color: var(--muted); opacity: 0.4;
  }
  .login-flag { display: flex; gap: 6px; margin-bottom: 2rem; }
  .login-flag span { display: block; width: 18px; height: 60px; }
  .flag-black { background: #111; border: 1px solid #333; }
  .flag-white { background: #eee; }
  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 0.05em; line-height: 0.9;
    text-align: center; margin-bottom: 0.5rem;
  }
  .login-title span { color: var(--accent); display: block; }
  .login-sub {
    color: var(--muted); font-size: 0.85rem;
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 3rem; text-align: center;
  }
  .user-select {
    display: flex; flex-direction: column; gap: 0.75rem;
    width: 100%; max-width: 320px; margin-bottom: 1.5rem;
  }
  .user-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 1rem 1.5rem; border-radius: 4px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
    text-align: left; display: flex; align-items: center; gap: 0.75rem;
  }
  .user-btn:hover { border-color: var(--accent); background: rgba(232,255,0,0.05); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  }
  .avatar-matt  { background: var(--accent); color: #000; }
  .avatar-alex  { background: #00b4d8; color: #000; }
  .avatar-james { background: var(--accent2); color: #fff; }
  .pin-screen {
    width: 100%; max-width: 320px;
    display: none; flex-direction: column; align-items: center; gap: 1.5rem;
  }
  .pin-screen.active { display: flex; }
  .pin-label { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .pin-dots { display: flex; gap: 1rem; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  .pin-dot.error  { background: var(--no); border-color: var(--no); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; width: 100%; }
  .pin-key {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 1.1rem; border-radius: 4px;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
    cursor: pointer; transition: all 0.1s; text-align: center;
  }
  .pin-key:hover  { background: var(--surface2); border-color: var(--accent); }
  .pin-key:active { transform: scale(0.95); }
  .pin-key.clear  { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; }
  .back-btn {
    background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    cursor: pointer; text-decoration: underline; margin-top: 0.5rem;
  }
  .login-error { color: var(--no); font-size: 0.85rem; min-height: 1.2em; text-align: center; }

  /* ── MAIN APP ── */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.active { display: flex; }
  .top-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.08em; color: var(--accent); }
  .top-bar-user  { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .status-dot    { width: 8px; height: 8px; border-radius: 50%; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.75rem;
    padding: 0.3rem 0.6rem; border-radius: 3px; cursor: pointer;
  }
  .nav {
    display: flex; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 53px; z-index: 99;
  }
  .nav-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase; padding: 0.9rem 0.5rem;
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; position: relative;
  }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-badge {
    position: absolute; top: 6px; right: calc(50% - 20px);
    background: var(--accent2); color: #fff; font-size: 0.6rem; font-weight: 700;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .view { display: none; padding: 1.25rem 1rem; flex: 1; }
  .view.active { display: block; }

  /* ── ADD VIEW ── */
  .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
  .search-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.75rem 1rem; border-radius: 4px;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .search-btn {
    background: var(--accent); border: none; color: #000;
    padding: 0.75rem 1.25rem; border-radius: 4px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
    cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
  }
  .search-btn:hover    { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .spotify-note {
    display: flex; align-items: center; gap: 0.5rem;
    background: rgba(29,185,84,0.1); border: 1px solid rgba(29,185,84,0.2);
    border-radius: 4px; padding: 0.75rem 1rem; margin-bottom: 1rem;
    font-size: 0.82rem; color: #1db954;
  }
  .not-connected {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 2rem; text-align: center;
  }
  .not-connected p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
  .spotify-connect-btn {
    background: #1db954; border: none; color: #fff;
    padding: 0.8rem 1.5rem; border-radius: 24px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: opacity 0.15s;
  }
  .spotify-connect-btn:hover { opacity: 0.85; }
  .track-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 0.75rem; display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.5rem; transition: border-color 0.15s;
  }
  .track-card:hover { border-color: #444; }
  .track-art { width: 48px; height: 48px; border-radius: 3px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .track-info { flex: 1; min-width: 0; }
  .track-name   { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .track-duration { color: var(--muted); font-size: 0.75rem; flex-shrink: 0; }
  .nominate-btn {
    background: var(--accent); border: none; color: #000;
    padding: 0.45rem 0.9rem; border-radius: 3px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem;
    cursor: pointer; flex-shrink: 0; transition: all 0.15s;
  }
  .nominate-btn:hover { opacity: 0.85; }
  .nominate-btn.already  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); cursor: default; }
  .nominate-btn.rejected { background: rgba(255,23,68,0.1); color: var(--no); border: 1px solid var(--no); cursor: default; font-size: 0.72rem; }
  .search-state { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 2rem 1rem; }

  /* ── QUEUE VIEW ── */
  .queue-empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 3rem 1rem; }
  .queue-card  { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0.9rem; margin-bottom: 0.75rem; }
  .queue-card-top { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.9rem; }
  .queue-track-info { flex: 1; min-width: 0; }
  .queue-nominator { font-size: 0.72rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 0.3rem; }
  .nominator-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .vote-pips { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .vote-pip  { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border); }
  .vote-pip.yes { background: var(--yes); border-color: var(--yes); }
  .vote-pip.no  { background: var(--no);  border-color: var(--no); }
  .vote-label { font-size: 0.72rem; color: var(--muted); }
  .queue-actions { display: flex; gap: 0.5rem; }
  .vote-btn {
    flex: 1; padding: 0.55rem; border-radius: 3px; border: 1px solid;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.8rem;
    cursor: pointer; transition: all 0.15s;
  }
  .vote-btn.yes-btn { background: rgba(0,230,118,0.08); border-color: rgba(0,230,118,0.3); color: var(--yes); }
  .vote-btn.yes-btn:hover:not(:disabled) { background: rgba(0,230,118,0.18); border-color: var(--yes); }
  .vote-btn.no-btn  { background: rgba(255,23,68,0.08);  border-color: rgba(255,23,68,0.3);  color: var(--no); }
  .vote-btn.no-btn:hover:not(:disabled)  { background: rgba(255,23,68,0.18);  border-color: var(--no); }
  .vote-btn:disabled { opacity: 0.35; cursor: default; }
  .vote-btn.voted-yes { background: rgba(0,230,118,0.2); border-color: var(--yes); }
  .vote-btn.voted-no  { background: rgba(255,23,68,0.2);  border-color: var(--no); }
  .own-vote-label { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 0.4rem; }

  /* ── PLAYLIST VIEW ── */
  .playlist-header {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 1rem; margin-bottom: 0.75rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  }
  .playlist-stats { font-size: 0.82rem; color: var(--muted); }
  .playlist-stats strong { color: var(--text); font-size: 1rem; display: block; margin-bottom: 2px; }
  .playlist-header-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .open-spotify-btn {
    background: #1db954; border: none; color: #fff;
    padding: 0.5rem 1rem; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.8rem;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }

  /* ── SYNC BUTTON ── */
  .sync-btn {
    background: transparent;
    border: 1px solid #1db954;
    color: #1db954;
    padding: 0.5rem 1rem; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.8rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
    transition: all 0.15s;
  }
  .sync-btn:hover    { background: rgba(29,185,84,0.1); }
  .sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .playlist-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.75rem; margin-bottom: 0.5rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .playlist-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--muted); width: 24px; text-align: center; flex-shrink: 0; }
  .playlist-track-info { flex: 1; min-width: 0; }
  .remove-btn {
    background: none; border: none; color: var(--muted);
    font-size: 1.1rem; cursor: pointer; padding: 0.25rem;
    border-radius: 3px; transition: color 0.15s; flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--no); }
  .playlist-empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 3rem 1rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 0.75rem 1.25rem; border-radius: 4px;
    font-size: 0.85rem; z-index: 999; transition: transform 0.3s ease;
    max-width: 90vw; text-align: center;
  }
  .toast.show    { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--yes); color: var(--yes); }
  .toast.error   { border-color: var(--no);  color: var(--no); }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 0.4rem;
  }
  .spinner-green { border-color: rgba(29,185,84,0.3); border-top-color: #1db954; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }

  .dot-matt  { background: var(--accent); }
  .dot-alex  { background: #00b4d8; }
  .dot-james { background: var(--accent2); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-flag">
    <span class="flag-black"></span><span class="flag-white"></span>
    <span class="flag-black"></span><span class="flag-white"></span>
  </div>
  <div class="login-title">Road Trip<span>Playlist</span></div>
  <div class="login-sub">Le Mans · June 2025</div>
  <div class="user-select" id="user-select">
    <button class="user-btn" onclick="selectUser('Matt')"><div class="avatar avatar-matt">M</div>Matt</button>
    <button class="user-btn" onclick="selectUser('Alex')"><div class="avatar avatar-alex">A</div>Alex</button>
    <button class="user-btn" onclick="selectUser('James')"><div class="avatar avatar-james">J</div>James</button>
  </div>
  <div class="pin-screen" id="pin-screen">
    <div class="pin-label">PIN for <span id="pin-username"></span></div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key clear" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key clear" onclick="pinBack()">←</button>
    </div>
    <div class="login-error" id="pin-error"></div>
    <button class="back-btn" onclick="backToUsers()">← Back</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="top-bar">
    <div class="top-bar-title">🏁 Le Mans Mix</div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div class="top-bar-user">
        <div class="status-dot" id="user-dot"></div>
        <span id="user-label"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-add"      onclick="showView('add')">＋ Add</button>
    <button class="nav-btn"        id="nav-queue"    onclick="showView('queue')">Voting <span class="nav-badge" id="queue-badge" style="display:none"></span></button>
    <button class="nav-btn"        id="nav-playlist" onclick="showView('playlist')">Playlist</button>
  </div>

  <!-- ADD -->
  <div class="view active" id="view-add">
    <div id="spotify-connect-area">
      <div class="not-connected">
        <p>Connect your Spotify account to search for songs</p>
        <button class="spotify-connect-btn" onclick="spotifyLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          Connect Spotify
        </button>
      </div>
    </div>
    <div id="spotify-search-area" style="display:none">
      <div class="spotify-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Spotify connected
      </div>
      <div class="search-bar">
        <input class="search-input" id="search-input" placeholder="Search songs or artists…" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="search-btn" id="search-btn" onclick="doSearch()">Search</button>
      </div>
      <div id="search-results"><div class="search-state">Search for a song to nominate it</div></div>
    </div>
  </div>

  <!-- QUEUE -->
  <div class="view" id="view-queue">
    <div class="section-label">Pending Votes</div>
    <div id="queue-list"><div class="queue-empty">No songs in the voting queue yet</div></div>
  </div>

  <!-- PLAYLIST -->
  <div class="view" id="view-playlist">
    <div class="playlist-header">
      <div class="playlist-stats">
        <strong id="playlist-count">0 songs</strong>
        <span id="playlist-duration">—</span>
      </div>
      <div class="playlist-header-actions">
        <!-- Sync button: Matt only, shown when Spotify connected -->

const FIREBASE_CONFIG = {

// ── STATE ───────────────────────────────────────

let spotifyToken      = null;
let spotifyUserId     = null;

let queue             = [];
let playlist          = [];
let rejected          = new Set();
let spotifyPlaylistId = null;
let unsubState        = null;
let unsubPlaylist     = null;

// ── FIRESTORE ───────────────────────────────────
async function saveState() {
  await setDoc(STATE_DOC(), {
    queue,
    rejected:          [...rejected],
    spotifyPlaylistId: spotifyPlaylistId || null,
  });
}
async function savePlaylist() {
  await setDoc(PLAYLIST_DOC(), { tracks: playlist });
}

function subscribeFirestore() {
  unsubState = onSnapshot(STATE_DOC(), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    queue             = d.queue    || [];
    rejected          = new Set(d.rejected || []);
    spotifyPlaylistId = d.spotifyPlaylistId || null;
    renderQueueView();
    renderPlaylistHeader();
    updateQueueBadge();
    // refresh search result buttons if visible
    const sr = document.getElementById('search-results');
    if (sr && sr.querySelector('.track-card')) renderAddView();
  });
  unsubPlaylist = onSnapshot(PLAYLIST_DOC(), snap => {
    playlist = snap.exists() ? (snap.data().tracks || []) : [];
    renderPlaylistView();
    updateQueueBadge();
  });
}
function unsubscribeFirestore() {
  if (unsubState)    { unsubState();    unsubState    = null; }
  if (unsubPlaylist) { unsubPlaylist(); unsubPlaylist = null; }
}

// ── LOGIN ───────────────────────────────────────
function selectUser(name) {
  pendingUser = name; pinBuffer = '';
  document.getElementById('user-select').style.display = 'none';
  document.getElementById('pin-screen').classList.add('active');
  document.getElementById('pin-username').textContent  = name;

  document.getElementById('pin-error').textContent = '';
}
function backToUsers() {
  document.getElementById('user-select').style.display = 'flex';
  document.getElementById('pin-screen').classList.remove('active');
  pinBuffer = '';
}
function pinPress(d) { if (pinBuffer.length >= 4) return; pinBuffer += d; updateDots(); if (pinBuffer.length === 4) checkPin(); }
function pinClear()  { pinBuffer = ''; updateDots(); }
function pinBack()   { pinBuffer = pinBuffer.slice(0, -1); updateDots(); }
function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);

    dot.classList.remove('error');

}
function checkPin() {
  if (pinBuffer === USERS[pendingUser].pin) {
    loginSuccess(pendingUser);
  } else {
    for (let i = 0; i < 4; i++) document.getElementById('d' + i).classList.add('error');
    document.getElementById('pin-error').textContent = 'Incorrect PIN';

async function loginSuccess(name) {
  currentUser = name;
  sessionStorage.setItem('lemans-user', name);

  document.getElementById('app').classList.add('active');

  subscribeFirestore();
  checkSpotifyCallback();
  restoreSpotifyToken();
}
function logout() {
  currentUser = null; spotifyToken = null;
  unsubscribeFirestore();
  sessionStorage.removeItem('lemans-user');
  sessionStorage.removeItem('lemans-token');

// ── SPOTIFY AUTH ────────────────────────────────
function generateVerifier(len = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr   = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return [...arr].map(b => chars[b % chars.length]).join('');
}
async function generateChallenge(v) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function spotifyLogin() {
  const verifier  = generateVerifier();
  const challenge = await generateChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('lemans-user',   currentUser);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id',             CLIENT_ID);
  url.searchParams.set('response_type',         'code');
  url.searchParams.set('redirect_uri',          REDIRECT_URI);
  url.searchParams.set('scope',                 SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge',        challenge);
  window.location.href = url.toString();
}
async function checkSpotifyCallback() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  if (!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) return;
  try {
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type:'authorization_code', code, redirect_uri:REDIRECT_URI, client_id:CLIENT_ID, code_verifier:verifier })
    });
    const data = await res.json();
    if (data.access_token) {
      spotifyToken = data.access_token;
      sessionStorage.setItem('lemans-token', spotifyToken);
      sessionStorage.removeItem('pkce_verifier');
      await fetchSpotifyUser();
      renderAddView();
      renderPlaylistHeader();
      showToast('Spotify connected!', 'success');
    }
  } catch { showToast('Spotify auth failed', 'error'); }
}
function restoreSpotifyToken() {
  const t = sessionStorage.getItem('lemans-token');
  if (t) { spotifyToken = t; fetchSpotifyUser().then(() => { renderAddView(); renderPlaylistHeader(); }); }
}
async function fetchSpotifyUser() {
  const res = await spotifyFetch('https://api.spotify.com/v1/me');
  if (res) spotifyUserId = res.id;
}
async function spotifyFetch(url, opts = {}) {
  if (!spotifyToken) return null;
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), Authorization:'Bearer '+spotifyToken } });
  if (res.status === 401) { spotifyToken = null; sessionStorage.removeItem('lemans-token'); renderAddView(); renderPlaylistHeader(); return null; }
  if (!res.ok) return null;
  return res.json().catch(() => null);
}

// ── SPOTIFY PLAYLIST ────────────────────────────
async function ensurePlaylist() {
  if (spotifyPlaylistId) return spotifyPlaylistId;
  if (!USERS[currentUser]?.admin) return null;
  const res = await spotifyFetch(`https://api.spotify.com/v1/users/${spotifyUserId}/playlists`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name:'🏁 Le Mans Road Trip 2025', description:'Our voted road trip playlist', public:false, collaborative:true })
  });
  if (res?.id) { spotifyPlaylistId = res.id; await saveState(); return res.id; }
  return null;
}

async function addToSpotifyPlaylist(trackId) {
  if (!spotifyToken) return;
  const pid = await ensurePlaylist();
  if (!pid) return;
  await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uris: [`spotify:track:${trackId}`] })
  });
}

async function removeFromSpotifyPlaylist(trackId) {
  if (!spotifyToken || !spotifyPlaylistId) return;
  await spotifyFetch(`https://api.spotify.com/v1/playlists/${spotifyPlaylistId}/tracks`, {
    method: 'DELETE', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracks: [{ uri:`spotify:track:${trackId}` }] })
  });
}

// ── SYNC ALL TO SPOTIFY ─────────────────────────
async function syncToSpotify() {
  if (!USERS[currentUser]?.admin || !spotifyToken) return;
  if (!playlist.length) { showToast('No approved songs to sync', ''); return; }

  const btn = document.getElementById('sync-btn');
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner spinner-green"></span>Syncing…';

  try {
    // 1. Create playlist if needed
    const pid = await ensurePlaylist();
    if (!pid) { showToast('Could not create Spotify playlist', 'error'); return; }

    // 2. Get current tracks already in the Spotify playlist to avoid duplicates
    let existingUris = new Set();
    let offset = 0;
    while (true) {
      const res = await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks?limit=100&offset=${offset}&fields=items(track(uri)),next`);
      if (!res) break;
      res.items.forEach(item => { if (item?.track?.uri) existingUris.add(item.track.uri); });
      if (!res.next) break;
      offset += 100;
    }

    // 3. Add only tracks not already in the playlist, in batches of 100
    const toAdd = playlist
      .map(s => `spotify:track:${s.id}`)
      .filter(uri => !existingUris.has(uri));

    for (let i = 0; i < toAdd.length; i += 100) {
      const batch = toAdd.slice(i, i + 100);
      await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: batch })
      });
    }

    renderPlaylistHeader();
    const added = toAdd.length;
    showToast(added > 0 ? `Synced ${added} song${added!==1?'s':''} to Spotify ✓` : 'Spotify already up to date ✓', 'success');
  } catch (e) {
    showToast('Sync failed — try again', 'error');
  } finally {
    btn.disabled  = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg> Sync to Spotify`;
  }
}

// ── NAV ─────────────────────────────────────────
function showView(name) {
  ['add','queue','playlist'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('active', v === name);
    document.getElementById('nav-'  + v).classList.toggle('active', v === name);
  });
}

// ── SEARCH ──────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q || !spotifyToken) return;
  const btn = document.getElementById('search-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Searching';
  document.getElementById('search-results').innerHTML = '<div class="search-state"><span class="spinner"></span> Searching Spotify…</div>';
  const res = await spotifyFetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=8`);
  btn.disabled = false; btn.textContent = 'Search';
  if (!res?.tracks?.items?.length) {
    document.getElementById('search-results').innerHTML = '<div class="search-state">No results found</div>';
    return;
  }
  renderSearchResults(res.tracks.items);
}

function renderSearchResults(tracks) {
  const el = document.getElementById('search-results');
  el.innerHTML = '';
  tracks.forEach(t => {
    const art  = t.album.images[2]?.url || t.album.images[0]?.url || '';
    const mins = Math.floor(t.duration_ms / 60000);
    const secs = Math.floor((t.duration_ms % 60000) / 1000).toString().padStart(2,'0');
    const inQ  = queue.find(s => s.id === t.id);
    const inP  = playlist.find(s => s.id === t.id);
    const isR  = rejected.has(t.id);
    let btn = '';
    if (isR)  btn = `<button class="nominate-btn rejected" disabled>Rejected</button>`;
    else if (inP) btn = `<button class="nominate-btn already"  disabled>In Playlist</button>`;
    else if (inQ) btn = `<button class="nominate-btn already"  disabled>In Queue</button>`;
    else          btn = `<button class="nominate-btn" onclick="nominate('${t.id}','${esc(t.name)}','${esc(t.artists[0].name)}','${esc(art)}',${t.duration_ms})">Nominate</button>`;
    el.innerHTML += `
      <div class="track-card">
        <img class="track-art" src="${art}" alt="" onerror="this.style.opacity=0">
        <div class="track-info">
          <div class="track-name">${t.name}</div>
          <div class="track-artist">${t.artists.map(a=>a.name).join(', ')}</div>
        </div>
        <div class="track-duration">${mins}:${secs}</div>
        ${btn}
      </div>`;
  });
}

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ── NOMINATIONS & VOTING ────────────────────────
async function nominate(id, name, artist, art, duration_ms) {
  if (queue.find(s=>s.id===id) || playlist.find(s=>s.id===id) || rejected.has(id)) return;
  queue.push({ id, name, artist, art, duration_ms, nominatedBy:currentUser, votes:{ [currentUser]:1 } });
  await saveState();
  showToast(`"${name}" added to voting queue!`, 'success');
}

async function vote(songId, val) {
  const song = queue.find(s => s.id === songId);
  if (!song || song.votes[currentUser] !== undefined) return;
  song.votes[currentUser] = val;
  const yes = Object.values(song.votes).filter(v=>v=== 1).length;
  const no  = Object.values(song.votes).filter(v=>v===-1).length;
  if (yes >= 2) {
    queue    = queue.filter(s => s.id !== songId);
    playlist = [...playlist, song];
    await saveState(); await savePlaylist();
    if (spotifyToken) addToSpotifyPlaylist(song.id);
    showToast(`"${song.name}" approved! 🎉`, 'success');
  } else if (no >= 2) {
    queue = queue.filter(s => s.id !== songId);
    rejected.add(songId);
    await saveState();
    showToast(`"${song.name}" rejected`, 'error');
  } else {
    await saveState();
  }
}

async function removeFromPlaylist(songId) {
  if (!USERS[currentUser]?.admin) return;
  const song = playlist.find(s => s.id === songId);
  if (!song) return;
  if (!confirm(`Remove "${song.name}" from the playlist?`)) return;
  playlist = playlist.filter(s => s.id !== songId);
  await savePlaylist();
  if (spotifyToken) removeFromSpotifyPlaylist(songId);
  showToast(`"${song.name}" removed`, 'error');
}

// ── RENDER ──────────────────────────────────────
function renderAddView() {
  document.getElementById('spotify-connect-area').style.display = spotifyToken ? 'none'  : 'block';
  document.getElementById('spotify-search-area').style.display  = spotifyToken ? 'block' : 'none';
}

function renderPlaylistHeader() {
  const isAdmin   = USERS[currentUser]?.admin;
  const syncBtn   = document.getElementById('sync-btn');
  const linkBtn   = document.getElementById('open-spotify-link');
  // Sync button: Matt + Spotify connected
  syncBtn.style.display = (isAdmin && spotifyToken) ? 'inline-flex' : 'none';
  // Open in Spotify: everyone, once playlist exists
  if (spotifyPlaylistId) {
    linkBtn.href         = `https://open.spotify.com/playlist/${spotifyPlaylistId}`;
    linkBtn.style.display = 'inline-flex';
  } else {
    linkBtn.style.display = 'none';
  }
}

function renderQueueView() {
  const el = document.getElementById('queue-list');
  if (!queue.length) { el.innerHTML = '<div class="queue-empty">No songs in the voting queue yet</div>'; return; }
  el.innerHTML = '';
  queue.forEach(song => {
    const yes    = Object.values(song.votes).filter(v=>v=== 1).length;
    const no     = Object.values(song.votes).filter(v=>v===-1).length;
    const myVote = song.votes[currentUser];
    const isOwn  = song.nominatedBy === currentUser;
    const mins   = Math.floor(song.duration_ms / 60000);
    const secs   = Math.floor((song.duration_ms % 60000) / 1000).toString().padStart(2,'0');
    const pips   = Object.keys(USERS).map(u => {
      const v = song.votes[u];
      if (v === 1)  return `<div class="vote-pip yes" title="${u}: Yes"></div>`;
      if (v === -1) return `<div class="vote-pip no"  title="${u}: No"></div>`;
      return `<div class="vote-pip" title="${u}: Not voted"></div>`;
    }).join('');
    let actions = '';
    if (isOwn) {
      actions = `<div class="own-vote-label">You nominated this — your vote is counted ✓</div>`;
    } else if (myVote !== undefined) {
      actions = `<div class="queue-actions">
        <button class="vote-btn yes-btn ${myVote===1?'voted-yes':''}"  disabled>✓ Yes</button>
        <button class="vote-btn no-btn  ${myVote===-1?'voted-no':''}" disabled>✗ No</button>
      </div>`;
    } else {
      actions = `<div class="queue-actions">
        <button class="vote-btn yes-btn" onclick="vote('${song.id}',1)">✓ Yes</button>
        <button class="vote-btn no-btn"  onclick="vote('${song.id}',-1)">✗ No</button>
      </div>`;
    }
    el.innerHTML += `
      <div class="queue-card">
        <div class="queue-card-top">
          <img class="track-art" src="${song.art}" alt="" onerror="this.style.opacity=0">
          <div class="queue-track-info">
            <div class="track-name">${song.name}</div>
            <div class="track-artist">${song.artist} · ${mins}:${secs}</div>
            <div class="queue-nominator">
              <span class="nominator-dot dot-${USERS[song.nominatedBy]?.color}"></span>
              Nominated by ${song.nominatedBy}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
            <div class="vote-pips">${pips}</div>
            <span class="vote-label">${yes} yes · ${no} no</span>
          </div>
        </div>
        ${actions}
      </div>`;
  });
}

function renderPlaylistView() {
  const el      = document.getElementById('playlist-list');
  const countEl = document.getElementById('playlist-count');
  const durEl   = document.getElementById('playlist-duration');
  const totalMs = playlist.reduce((a,s) => a + s.duration_ms, 0);
  const h = Math.floor(totalMs / 3600000);
  const m = Math.floor((totalMs % 3600000) / 60000);
  countEl.textContent = `${playlist.length} song${playlist.length !== 1 ? 's' : ''}`;
  durEl.textContent   = totalMs ? (h ? `${h}h ${m}m` : `${m} min`) : '';
  renderPlaylistHeader();
  if (!playlist.length) { el.innerHTML = '<div class="playlist-empty">No approved songs yet — start voting!</div>'; return; }
  const isAdmin = USERS[currentUser]?.admin;
  el.innerHTML  = '';
  playlist.forEach((song, i) => {
    const mins = Math.floor(song.duration_ms / 60000);
    const secs = Math.floor((song.duration_ms % 60000) / 1000).toString().padStart(2,'0');
    el.innerHTML += `
      <div class="playlist-item">
        <div class="playlist-num">${i + 1}</div>
        <img class="track-art" src="${song.art}" alt="" onerror="this.style.opacity=0">
        <div class="playlist-track-info">
          <div class="track-name">${song.name}</div>
          <div class="track-artist">${song.artist} · ${mins}:${secs}</div>
        </div>
        ${isAdmin ? `<button class="remove-btn" onclick="removeFromPlaylist('${song.id}')" title="Remove">🗑</button>` : ''}
      </div>`;
  });
}

function updateQueueBadge() {
  const badge    = document.getElementById('queue-badge');
  const voteable = queue.filter(s => s.nominatedBy !== currentUser && s.votes[currentUser] === undefined).length;
  badge.textContent   = voteable;
  badge.style.display = voteable > 0 ? 'flex' : 'none';
}

// ── TOAST ───────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── EXPOSE ──────────────────────────────────────
Object.assign(window, {
  selectUser, backToUsers, pinPress, pinClear, pinBack,
  logout, showView, spotifyLogin, doSearch,
  nominate, vote, removeFromPlaylist, syncToSpotify
});

// ── INIT ────────────────────────────────────────
(async () => {
  const saved = sessionStorage.getItem('lemans-user');
  if (saved && USERS[saved]) await loginSuccess(saved);
})();
</script>
