<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Mans Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0d1a;
    --surface:  #13132a;
    --surface2: #1a1a36;
    --border:   #2a2a50;
    --blue:     #002395;
    --red:      #ED2939;
    --cream:    #f5f0e8;
    --gold:     #c9a84c;
    --text:     #e8e4f0;
    --muted:    #6b6890;
    --yes:      #4caf7d;
    --no:       #e05a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .tricolore { display: flex; height: 4px; width: 100%; }
  .tricolore span { flex: 1; }
  .tricolore .t-blue  { background: var(--blue); }
  .tricolore .t-white { background: #fff; }
  .tricolore .t-red   { background: var(--red); }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem; position: relative; overflow: hidden;
  }
  #login-screen::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(0,35,149,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(237,41,57,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  .login-flag-vert {
    display: flex; height: 80px; width: 60px;
    border-radius: 3px; overflow: hidden; margin-bottom: 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); flex-shrink: 0;
  }
  .login-flag-vert span { flex: 1; }
  .fv-blue  { background: var(--blue); }
  .fv-white { background: #f8f8f8; }
  .fv-red   { background: var(--red); }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 11vw, 5rem); font-weight: 900;
    letter-spacing: -0.01em; line-height: 0.95;
    text-align: center; margin-bottom: 0.5rem; color: var(--cream);
  }
  .login-title span {
    color: var(--gold); display: block; font-size: 0.55em;
    letter-spacing: 0.25em; text-transform: uppercase;
    font-weight: 700; margin-top: 0.4rem;
  }
  .login-sub {
    color: var(--muted); font-size: 0.8rem; letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 2.5rem; text-align: center;
  }

  .user-select { display: flex; flex-direction: column; gap: 0.65rem; width: 100%; max-width: 300px; }
  .user-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 0.9rem 1.25rem; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: all 0.18s; text-align: left;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .user-btn:hover { border-color: var(--gold); background: rgba(201,168,76,0.07); transform: translateX(3px); }

  .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .av-matt  { background: var(--blue); color: #fff; }
  .av-alex  { background: var(--red);  color: #fff; }
  .av-james { background: var(--gold); color: #000; }

  .pin-screen { width: 100%; max-width: 300px; display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
  .pin-screen.active { display: flex; }
  .pin-label { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .pin-dots  { display: flex; gap: 1rem; }
  .pin-dot   { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.15s; }
  .pin-dot.filled { background: var(--gold); border-color: var(--gold); }
  .pin-dot.error  { background: var(--no);   border-color: var(--no); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem; width: 100%; }
  .pin-key {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 1rem; border-radius: 6px; font-family: 'Playfair Display', serif;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: all 0.12s; text-align: center;
  }
  .pin-key:hover  { background: var(--surface2); border-color: var(--gold); }
  .pin-key:active { transform: scale(0.94); }
  .pin-key.clear  { font-family: 'DM Sans', sans-serif; font-size: 0.9rem; }
  .back-btn { background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
  .login-error { color: var(--no); font-size: 0.82rem; min-height: 1.2em; text-align: center; }

  /* ── MAIN APP ── */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.active { display: flex; }

  .top-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0.7rem 1rem; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: var(--gold); letter-spacing: 0.02em; }
  .top-bar-right { display: flex; align-items: center; gap: 0.6rem; }
  .top-bar-user  { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--muted); }
  .status-dot    { width: 7px; height: 7px; border-radius: 50%; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.72rem; padding: 0.28rem 0.6rem;
    border-radius: 4px; cursor: pointer; transition: border-color 0.15s;
  }
  .logout-btn:hover { border-color: var(--muted); }

  .nav { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 49px; z-index: 99; }
  .nav-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase; padding: 0.85rem 0.5rem;
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; position: relative;
  }
  .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .nav-badge {
    position: absolute; top: 5px; right: calc(50% - 22px);
    background: var(--red); color: #fff; font-size: 0.58rem; font-weight: 700;
    width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }

  .view { display: none; padding: 1.1rem 1rem; flex: 1; }
  .view.active { display: block; }

  /* ── SPOTIFY CONNECT ── */
  .not-connected { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; text-align: center; }
  .not-connected p { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.25rem; line-height: 1.5; }
  .spotify-connect-btn {
    background: #1db954; border: none; color: #fff; padding: 0.75rem 1.5rem; border-radius: 24px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.88rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: opacity 0.15s;
  }
  .spotify-connect-btn:hover { opacity: 0.85; }
  .spotify-connected-note {
    display: flex; align-items: center; gap: 0.5rem;
    background: rgba(29,185,84,0.08); border: 1px solid rgba(29,185,84,0.2);
    border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem;
    font-size: 0.8rem; color: #1db954;
  }

  /* ── SEARCH ── */
  .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .search-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 0.7rem 1rem; border-radius: 6px; font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem; outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--muted); }
  .search-btn {
    background: var(--gold); border: none; color: #000; padding: 0.7rem 1.2rem; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.88rem;
    cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
  }
  .search-btn:hover    { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .track-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.7rem; display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 0.45rem; transition: border-color 0.15s;
  }
  .track-card:hover { border-color: #3a3a60; }
  .track-art      { width: 46px; height: 46px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .track-info     { flex: 1; min-width: 0; }
  .track-name     { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist   { color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .track-duration { color: var(--muted); font-size: 0.73rem; flex-shrink: 0; }

  .nominate-btn {
    border: none; padding: 0.4rem 0.8rem; border-radius: 4px;
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.75rem;
    cursor: pointer; flex-shrink: 0; transition: all 0.15s; background: var(--gold); color: #000;
  }
  .nominate-btn:hover { opacity: 0.85; }
  .nominate-btn.already  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); cursor: default; }
  .nominate-btn.rejected { background: rgba(224,90,90,0.1); color: var(--no); border: 1px solid var(--no); cursor: default; }
  .search-state { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 2rem 1rem; }

  /* ── QUEUE ── */
  .section-label { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .queue-empty    { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 3rem 1rem; }
  .playlist-empty { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 3rem 1rem; }

  .queue-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.85rem; margin-bottom: 0.65rem; }
  .queue-card-top { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.85rem; }
  .queue-track-info { flex: 1; min-width: 0; }
  .queue-nominator { font-size: 0.7rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 0.3rem; }
  .nominator-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .vote-pips { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .vote-pip  { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border); }
  .vote-pip.yes { background: var(--yes); border-color: var(--yes); }
  .vote-pip.no  { background: var(--no);  border-color: var(--no); }
  .vote-tally { font-size: 0.7rem; color: var(--muted); }

  .queue-actions { display: flex; gap: 0.5rem; }
  .vote-btn { flex: 1; padding: 0.52rem; border-radius: 5px; border: 1px solid; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem; cursor: pointer; transition: all 0.15s; }
  .vote-btn.yes-btn { background: rgba(76,175,125,0.08); border-color: rgba(76,175,125,0.3); color: var(--yes); }
  .vote-btn.yes-btn:hover:not(:disabled) { background: rgba(76,175,125,0.18); border-color: var(--yes); }
  .vote-btn.no-btn  { background: rgba(224,90,90,0.08);  border-color: rgba(224,90,90,0.3);  color: var(--no); }
  .vote-btn.no-btn:hover:not(:disabled)  { background: rgba(224,90,90,0.18);  border-color: var(--no); }
  .vote-btn:disabled  { opacity: 0.35; cursor: default; }
  .vote-btn.voted-yes { background: rgba(76,175,125,0.2); border-color: var(--yes); }
  .vote-btn.voted-no  { background: rgba(224,90,90,0.2);  border-color: var(--no); }
  .own-vote-label { text-align: center; font-size: 0.73rem; color: var(--muted); padding: 0.4rem; }

  /* ── PLAYLIST ── */
  .playlist-header {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.9rem 1rem; margin-bottom: 0.9rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
  }
  .playlist-stats strong { color: var(--cream); font-size: 1rem; display: block; margin-bottom: 2px; }
  .playlist-stats span   { color: var(--muted); font-size: 0.8rem; }
  .playlist-header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  .sync-btn {
    background: #1db954; border: none; color: #fff; padding: 0.5rem 1rem; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: opacity 0.15s;
  }
  .sync-btn:hover    { opacity: 0.85; }
  .sync-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .sync-connect-btn {
    background: transparent; border: 1px solid #1db954; color: #1db954;
    padding: 0.5rem 1rem; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.15s;
  }
  .sync-connect-btn:hover { background: rgba(29,185,84,0.1); }
  .open-spotify-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 0.5rem 1rem; border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem;
    text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.15s;
  }
  .open-spotify-btn:hover { border-color: var(--muted); color: var(--text); }

  .playlist-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.7rem 0.8rem; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.7rem;
  }
  .playlist-num { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--muted); width: 22px; text-align: center; flex-shrink: 0; }
  .playlist-track-info { flex: 1; min-width: 0; }
  .remove-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 0.2rem; border-radius: 3px; transition: color 0.15s; flex-shrink: 0; }
  .remove-btn:hover { color: var(--no); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 0.7rem 1.2rem; border-radius: 6px; font-size: 0.83rem; z-index: 999;
    transition: transform 0.28s ease; max-width: 88vw; text-align: center; pointer-events: none;
  }
  .toast.show    { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--yes); color: var(--yes); }
  .toast.error   { border-color: var(--no);  color: var(--no); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.35rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dot-matt  { background: var(--blue); }
  .dot-alex  { background: var(--red); }
  .dot-james { background: var(--gold); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-flag-vert">
    <span class="fv-blue"></span><span class="fv-white"></span><span class="fv-red"></span>
  </div>
  <div class="login-title">
    Le Mans
    <span>Road Trip Mix</span>
  </div>
  <div class="login-sub">June 2025 · Circuit de la Sarthe</div>

  <div class="user-select" id="user-select">
    <button class="user-btn" onclick="selectUser('Matt')">
      <div class="avatar av-matt">M</div>Matt
    </button>
    <button class="user-btn" onclick="selectUser('Alex')">
      <div class="avatar av-alex">A</div>Alex
    </button>
    <button class="user-btn" onclick="selectUser('James')">
      <div class="avatar av-james">J</div>James
    </button>
  </div>

  <div class="pin-screen" id="pin-screen">
    <div class="pin-label">PIN — <span id="pin-username"></span></div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key clear" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key clear" onclick="pinBack()">←</button>
    </div>
    <div class="login-error" id="pin-error"></div>
    <button class="back-btn" onclick="backToUsers()">← Back</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="tricolore"><span class="t-blue"></span><span class="t-white"></span><span class="t-red"></span></div>
  <div class="top-bar">
    <div class="top-bar-title">🏁 Le Mans Mix</div>
    <div class="top-bar-right">
      <div class="top-bar-user">
        <div class="status-dot" id="user-dot"></div>
        <span id="user-label"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-add"      onclick="showView('add')">＋ Add</button>
    <button class="nav-btn"        id="nav-queue"    onclick="showView('queue')">
      Votes <span class="nav-badge" id="queue-badge" style="display:none"></span>
    </button>
    <button class="nav-btn"        id="nav-playlist" onclick="showView('playlist')">Playlist</button>
  </div>

  <!-- ADD VIEW -->
  <div class="view active" id="view-add">
    <div id="spotify-connect-area" style="display:none">
      <div class="not-connected">
        <p>Connect Spotify to search for songs.<br>Only Matt can sync the final playlist.</p>
        <button class="spotify-connect-btn" onclick="spotifyLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          Connect Spotify
        </button>
      </div>
    </div>

    <div id="spotify-search-area" style="display:none">
      <div class="spotify-connected-note">

// ── SPOTIFY PKCE ─────────────────────────────────────────────────────────────
function genVerifier(n=64) {
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const a=new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(b=>c[b%c.length]).join('');
}
async function genChallenge(v) {
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function spotifyLogin() {
  const isAdmin  = USERS[currentUser]?.admin;
  const scope    = isAdmin ? SCOPE_PLAYLIST : SCOPE_SEARCH;
  const verifier = genVerifier();
  const challenge= await genChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('lemans-user',   currentUser);
  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id',             CLIENT_ID);
  url.searchParams.set('response_type',         'code');
  url.searchParams.set('redirect_uri',          REDIRECT_URI);
  url.searchParams.set('scope',                 scope);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge',        challenge);
  // Force re-auth dialog so Spotify grants the correct scopes (fixes 403 on playlist creation)
  url.searchParams.set('show_dialog',           'true');
  window.location.href = url.toString();
}

async function checkCallback() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  if (!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) return;
  try {
    const res  = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type:'authorization_code', code,
        redirect_uri:REDIRECT_URI, client_id:CLIENT_ID, code_verifier:verifier
      })
    });
    const data = await res.json();
    if (data.access_token) {
      spotifyToken = data.access_token;
      sessionStorage.setItem('lemans-token', spotifyToken);
      sessionStorage.removeItem('pkce_verifier');
      renderAddView(); renderPlaylistActions();
      showToast('Spotify connected!', 'success');
    }
  } catch { showToast('Spotify auth error', 'error'); }
}

function restoreToken() {
  const t = sessionStorage.getItem('lemans-token');
  if (t) spotifyToken = t;
}

async function spotifyFetch(url, opts={}) {
  if (!spotifyToken) return null;
  const res = await fetch(url, { ...opts, headers:{...(opts.headers||{}), Authorization:'Bearer '+spotifyToken} });
  if (res.status === 401) {
    spotifyToken=null; sessionStorage.removeItem('lemans-token');
    renderAddView(); renderPlaylistActions(); return null;
  }
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    console.error('Spotify error', res.status, err);
    // Surface 403 clearly — usually a scope issue
    if (res.status === 403) showToast('Spotify permission denied — please reconnect Spotify', 'error');
    return null;
  }
  return res.json().catch(()=>null);
}

// ── SYNC TO SPOTIFY (Matt only) ──────────────────────────────────────────────
async function syncToSpotify() {
  if (!USERS[currentUser]?.admin) return;
  if (!spotifyToken) { showToast('Connect Spotify first', 'error'); return; }
  if (!playlist.length) { showToast('No approved songs yet', ''); return; }

  const btn = document.getElementById('sync-btn');
  if (!btn) return;
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>Syncing…';

  try {
    const me = await spotifyFetch('https://api.spotify.com/v1/me');
    if (!me?.id) { showToast('Could not get Spotify profile', 'error'); return; }

    let pid = spotifyPlaylistId;
    if (!pid) {
      const pl = await spotifyFetch(`https://api.spotify.com/v1/users/${me.id}/playlists`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:        '🏁 Le Mans Road Trip 2025',
          description: 'Our collaborative road trip playlist',
          public:      false,
        })
      });
      if (!pl?.id) { showToast('Could not create playlist', 'error'); return; }
      pid = pl.id;
      spotifyPlaylistId = pid;
      await saveState();
    }

    const existing = new Set();
    let offset = 0;
    while (true) {
      const r = await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks?limit=100&offset=${offset}&fields=items(track(uri)),next`);
      if (!r) break;
      r.items?.forEach(i => { if (i?.track?.uri) existing.add(i.track.uri); });
      if (!r.next) break;
      offset += 100;
    }

    const toAdd = playlist.map(s=>`spotify:track:${s.id}`).filter(u=>!existing.has(u));
    for (let i=0; i<toAdd.length; i+=100) {
      await spotifyFetch(`https://api.spotify.com/v1/playlists/${pid}/tracks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: toAdd.slice(i,i+100) })
      });
    }

    renderPlaylistActions();
    showToast(toAdd.length ? `${toAdd.length} song${toAdd.length>1?'s':''} synced ✓` : 'Spotify already up to date ✓', 'success');
  } catch(e) {
    console.error(e);
    showToast('Sync error', 'error');
  } finally {
    if (document.getElementById('sync-btn')) renderPlaylistActions();
  }
}

async function removeFromSpotify(trackId) {

  await spotifyFetch(`https://api.spotify.com/v1/playlists/${spotifyPlaylistId}/tracks`, {
    method: 'DELETE', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracks:[{ uri:`spotify:track:${trackId}` }] })
  });
}

function renderSearchResults(tracks) {

    const secs = Math.floor((t.duration_ms%60000)/1000).toString().padStart(2,'0');
    const inQ  = queue.find(s=>s.id===t.id);
    const inP  = playlist.find(s=>s.id===t.id);
    const isR  = rejected.has(t.id);

    if (isR)      btn=`<button class="nominate-btn rejected" disabled>Rejected</button>`;
    else if (inP) btn=`<button class="nominate-btn already"  disabled>Approved</button>`;
    else if (inQ) btn=`<button class="nominate-btn already"  disabled>Pending</button>`;
    else          btn=`<button class="nominate-btn" onclick="nominate('${t.id}','${esc(t.name)}','${esc(t.artists[0].name)}','${esc(art)}',${t.duration_ms})">Nominate</button>`;

      <div class="track-card">

          <div class="track-name">${t.name}</div>
          <div class="track-artist">${t.artists.map(a=>a.name).join(', ')}</div>
        </div>
        <div class="track-duration">${mins}:${secs}</div>
        ${btn}
      </div>`;
  });
}

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ── NOMINATE & VOTE ──────────────────────────────────────────────────────────
async function nominate(id, name, artist, art, duration_ms) {
  if (queue.find(s=>s.id===id)||playlist.find(s=>s.id===id)||rejected.has(id)) return;
  queue.push({ id, name, artist, art, duration_ms, nominatedBy:currentUser, votes:{[currentUser]:1} });
  await saveState();
  showToast(`"${name}" added to the queue!`, 'success');
}

async function vote(songId, val) {
  const song = queue.find(s=>s.id===songId);
  if (!song || song.votes[currentUser]!==undefined) return;
  song.votes[currentUser] = val;
  const yes = Object.values(song.votes).filter(v=>v=== 1).length;
  const no  = Object.values(song.votes).filter(v=>v===-1).length;
  if (yes >= 2) {
    queue    = queue.filter(s=>s.id!==songId);
    playlist = [...playlist, song];
    await saveState(); await savePlaylist();
    showToast(`"${song.name}" approved! 🎉`, 'success');
  } else if (no >= 2) {
    queue = queue.filter(s=>s.id!==songId);
    rejected.add(songId);
    await saveState();
    showToast(`"${song.name}" rejected`, 'error');
  } else {
    await saveState();
  }
}

async function removeTrack(songId) {
  if (!USERS[currentUser]?.admin) return;
  const song = playlist.find(s=>s.id===songId);
  if (!song) return;
  if (!confirm(`Remove "${song.name}" from the playlist?`)) return;
  playlist = playlist.filter(s=>s.id!==songId);
  await savePlaylist();
  if (spotifyToken && spotifyPlaylistId) removeFromSpotify(songId);
  showToast(`"${song.name}" removed`, 'error');
}

    const mins   = Math.floor(song.duration_ms/60000);

            <div class="queue-nominator">
              <span class="nominator-dot dot-${USERS[song.nominatedBy]?.color}"></span>
              Nominated by ${song.nominatedBy}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0">
            <div class="vote-pips">${pips}</div>
            <span class="vote-tally">${yes} yes · ${no} no</span>
          </div>
        </div>
        ${actions}
      </div>`;
  });
}

function renderPlaylistView() {
  const el      = document.getElementById('playlist-list');
  const countEl = document.getElementById('playlist-count');
  const durEl   = document.getElementById('playlist-duration');
  const ms      = playlist.reduce((a,s)=>a+s.duration_ms,0);
  const h       = Math.floor(ms/3600000);
  const m       = Math.floor((ms%3600000)/60000);
  countEl.textContent = `${playlist.length} song${playlist.length!==1?'s':''}`;
  durEl.textContent   = ms ? (h?`${h}h ${m}m`:`${m} min`) : '';
  if (!playlist.length) { el.innerHTML='<div class="playlist-empty">No approved songs yet — start voting!</div>'; return; }
  const isAdmin = USERS[currentUser]?.admin;
  el.innerHTML  = '';
  playlist.forEach((song,i)=>{
    const mins=Math.floor(song.duration_ms/60000);
    const secs=Math.floor((song.duration_ms%60000)/1000).toString().padStart(2,'0');
    el.innerHTML+=`
      <div class="playlist-item">
        <div class="playlist-num">${i+1}</div>
        <img class="track-art" src="${song.art}" alt="" onerror="this.style.opacity=0">
        <div class="playlist-track-info">
          <div class="track-name">${song.name}</div>
          <div class="track-artist">${song.artist} · ${mins}:${secs}</div>
        </div>
        ${isAdmin?`<button class="remove-btn" onclick="removeTrack('${song.id}')" title="Remove">🗑</button>`:''}
      </div>`;
  });
}

function updateBadge() {
  const badge    = document.getElementById('queue-badge');
  const voteable = queue.filter(s=>s.nominatedBy!==currentUser && s.votes[currentUser]===undefined).length;
  badge.textContent   = voteable;
  badge.style.display = voteable>0 ? 'flex' : 'none';
}

let toastT;
function showToast(msg, type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+type;
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

Object.assign(window,{
  selectUser,backToUsers,pinPress,pinClear,pinBack,
  logout,showView,spotifyLogin,doSearch,
  nominate,vote,removeTrack,syncToSpotify
});

(async()=>{
  const saved=sessionStorage.getItem('lemans-user');
  if (saved && USERS[saved]) await loginSuccess(saved);
})();
</script>
